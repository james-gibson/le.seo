name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A vendored card that no longer matches the seed it quotes is a pitch
      # that has quietly gone stale. Same trade as a vendored rules.md.
      - run: npm run cards:check

      # Every destination is a door. A 404 front door, or an implicit link that
      # leaves its mount, fails here rather than in front of a reader. Needs the
      # network by nature, which is why it is a CI step and not part of build.
      - run: npm run doors

      # tsc --noEmit, vite build, postbuild, and the publish guard.
      # A guard failure stops the deploy here, not in production.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
